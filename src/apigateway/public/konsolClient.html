<!doctype html>
<html>

<head>
    <title>Apigateway Konsol.log</title>
    <style>
        .fieldStyle0 {
            font-style: italic;
            font-weight: bold;
            background-color: lightgrey;
        }

        .fieldStyle1 {
            font-style: normal;
            xfont-weight: bolder;
        }

        .connected {
            background-color: greenyellow;
        }
        .disconnected {
            background-color: red;
        }

        #container {
            width: 1200px;
            height: 600px;
            /* Hauteur fixe pour activer le défilement */
            overflow-x: auto;
            overflow-y: auto;
            /* Active le défilement vertical */
            border: 1px solid #ccc;
            padding: 10px;
        }
    </style>
    <script>
        let konsol;
        let fieldDisplayLength = 160
        let fieldDisplayCount = 3

        //---------------------------------------------------------------------------------------
        function setLocalParms() {
            fieldDisplayLength = parseInt(document.getElementById("fieldDisplayLength").value)
            console.log("setParms() fieldDisplayLength", document.getElementById("fieldDisplayLength").value)
            fieldDisplayCount = parseInt(document.getElementById("fieldDisplayCount").value)
            console.log("setParms() fieldDisplayCount", document.getElementById("fieldDisplayCount").value)
        }

        //---------------------------------------------------------------------------------------
        function stackTrace() {
            sendMessage({type:"cmd",value:"toggleStackTrace"})
        }

        //---------------------------------------------------------------------------------------
        function getFieldDisplayLength() {
            return (fieldDisplayLength)
        }
        //---------------------------------------------------------------------------------------
        function writeMark() {
            //
            append('------------------- Mark ------------------')
        }

        //---------------------------------------------------------------------------------------
        append = function (text) {
            //console.log(text)
            try {
                jEvent = JSON.parse(text)
                //console.log(jEvent)
                //let jEvent = JSON.parse(text)
                let header = `${jEvent['date']}  ${jEvent['fields'][0]}`
                //let  = document.getElementById("konsolEvents")
                let entry = document.createElement('li')
                entry.innerHTML = `<b>${header}</b>`;
                let table = document.createElement("table")
                //console.log("fieldDisplayLength", fieldDisplayLength)
                if (document.getElementById("mergeFields").checked) {
                    let tr = document.createElement("tr")
                    let td = document.createElement("td")
                    td.appendChild(document.createTextNode("-> Merged |"))
                    for (let i = 1; i < jEvent['fields'].length; i++) {
                        //output += `<span class="fieldStyle${i % 2}">${JSON.stringify(jEvent['fields'][i], '').substr(0, fieldDisplayLength)}</span>|`
                        const span = document.createElement("span")
                        span.setAttribute("class", `fieldStyle${i % 2}`)
                        const txt = document.createTextNode(`${JSON.stringify(jEvent['fields'][i]).substr(0, fieldDisplayLength)}|`)
                        //txt.setAttribute("class",`fieldStyle${i % 2}`)
                        span.appendChild(txt)
                        td.appendChild(span)
                    }
                    //td.innerHTML = output
                    tr.appendChild(td)
                    table.appendChild(tr)
                } else {
                    //console.log(jEvent['fields'])
                    for (let i = 1; i < jEvent['fields'].length; i++) {
                        let tr = document.createElement("tr")
                        let td = document.createElement("td")
                        const txt = document.createTextNode(`${JSON.stringify(jEvent['fields'][i]).substr(0, fieldDisplayLength)}`)
                        td.appendChild(txt)
                        tr.appendChild(td)
                        table.appendChild(tr)
                    }
                }
                entry.appendChild(table)
                document.getElementById("konsolEvents").insertAdjacentElement('beforeend', entry)
                if (jEvent['stack']) {
                    //document.getElementById("konsolEvents").insertAdjacentElement('beforeend', jEvent['stack'])
                    let lines = jEvent['stack'].split('\n')
                    console.log("lines",lines)
                    let table = document.createElement("table")
                    for (let i = 2; i < lines.length -1; i++) {
                        console.log(lines[i])
                        let tr = document.createElement("tr")
                        let td = document.createElement("td")
                        td.appendChild(document.createTextNode(`${i} -- ${lines[i]}`))
                        tr.appendChild(td)
                        table.appendChild(tr)
                    }
                                      
                    document.getElementById("konsolEvents").insertAdjacentElement('beforeend', table)
                }
                
            } catch (error) {
                console.log(error)
                let entry = document.getElementById("konsolEvents")
                entry.insertAdjacentHTML("beforeend", `<li>${text}</li>`);
            }
            const container = document.getElementById('container')
            container.scrollTop = container.scrollHeight;
        }

        //---------------------------------------------------------------------------------------------
        function clearEvents() {
            console.log("clear()")
            let title = document.createElement("h2")
            title.innerHTML = "Konsol events"
            document.getElementById("konsolEvents").replaceChildren(title)
        }

        //---------------------------------------------------------------------
        function connect() {
            const url = "ws://localhost:3002"
            append(`konsolClient.connect() connecting to ${url}`);
            console.log("konsolClient.connect() connecting to ", url)
            konsol = new WebSocket(url);
            konsol.onmessage = function (event) {
                append(event.data);
            };
            konsol.onopen = function () {
                append(`konsolClient.connect() connected to ${url}`);
                document.getElementById("connectStatus").innerHTML = " Connected"
                document.getElementById("connectButton").setAttribute("disabled", "")
                document.getElementById("disconnectButton").removeAttribute("disabled")
                document.getElementById("connectStatus").classList.remove("disconnected")
                document.getElementById("connectStatus").classList.add("connected")
                console.log("konsolClient.connect() connected to ", url)
            };
            konsol.onclose = function () {
                document.getElementById("connectStatus").innerHTML = " Not connected"
                document.getElementById("connectButton").removeAttribute("disabled")
                document.getElementById("disconnectButton").setAttribute("disabled", "")
                document.getElementById("connectStatus").classList.add("disconnected")
                document.getElementById("connectStatus").classList.remove("connected")
                append("Connection closed");
            };
            konsol.onerror = function () {
                append("Error happens");
            };
        };

        //---------------------------------------------------------------------
        function disconnect() {
            konsol.close()
            document.getElementById("disconnectButton").setAttribute("disabled", "")
        }

        //--------------------------------------------------------------------
        function sendMessage(event) {
            console.log(event);
            let message = document.getElementById("message").value;
            konsol.send(message);
        }
    </script>
</head>

<body onload="connect()">
    <h1>Konsol.log Client</h1>
    <div>
        <input type="button" id="connectButton" value="Connect" onclick="connect()" />
        <input type="button" id="disconnectButton" value="Disconnect" onclick="disconnect()" />
        <span id="connectStatus">Not connected</span><br />
        <form>
            fieldDisplayLength: <input value="160" id="fieldDisplayLength" />
            fieldDisplayCount : <input value="3" id="fieldDisplayCount" />
            mergeFields : <input type="checkbox" id="mergeFields" checked />
            <br /><input type="button" value="setLocalParms" onclick="setLocalParms()" />
        </form>

        <input type="button" value="StackTrace on/off" onclick="stackTrace()" />
        Message: <input value="Hello!" type="text" id="message" />
        <input type="button" value="Send" onclick="sendMessage(event)" /><br />

        <input type="button" value="Clear" onclick="clearEvents()" />
        <input type="button" value="writeMark" onclick="writeMark()" /><br />
    </div>
    <div id="container">
        <ul id="konsolEvents"></ul>
    </div>
</body>

</body>

</html>
